<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Clash Classic</title>
  <meta name="description" content="Clash Classic community tournaments: leaderboards, player profiles and event history.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#/">
        <img class="brand-logo" src="assets/logo.svg" alt="" onerror="this.remove()">
        <span class="brand-name" data-site-name>Clash Classic</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="home">Home</a>
        <a href="#/leaderboards" data-nav="leaderboards">Leaderboards</a>
        <a href="#/players" data-nav="players">Players</a>
        <a href="#/events" data-nav="events">Events</a>
        <a class="nav-cta" id="nav-signup" href="#" hidden>Sign up</a>
        <span class="nav-auth" id="nav-auth"></span>
      </nav>
    </div>
  </header>

  <main id="app" class="wrap" aria-live="polite">
    <div class="loading">Loading stats…</div>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <span data-site-name>Clash Classic</span>
      <span class="muted">Stats update automatically from the Clash mod team's sheet.</span>
      <a id="footer-discord" href="#" target="_blank" rel="noopener" hidden>Join the Discord</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
